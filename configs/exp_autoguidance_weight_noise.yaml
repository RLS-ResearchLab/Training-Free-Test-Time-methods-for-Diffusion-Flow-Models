experiment_name: "AutoGuidance_WeightNoise"
model_id: "stabilityai/stable-diffusion-3.5-medium"
prompt: "A high-tech cybernetic garden, cinematic lighting, 8k"
negative_prompt: "blurry, low quality, distorted"
seed: 42
num_inference_steps: 30
cfg_scale: 7.5
auto_guidance_scale: 3.5
auto_guidance_variant: "weight_noise"
weight_noise_std: 0.02           # relative Gaussian noise injected into transformer weights
methods:
  - "cfg"
  - "auto_guidance"